global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-nexus-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8080" # edge-gateway
          - "host.docker.internal:8081" # identity-service
          - "host.docker.internal:8082" # organization-service
          - "host.docker.internal:8083" # api-registry-service
          - "host.docker.internal:8084" # api-key-service
          - "host.docker.internal:8085" # rate-limit-service
          - "host.docker.internal:8086" # developer-service
          - "host.docker.internal:8087" # workflow-service
          - "host.docker.internal:8088" # notification-service

