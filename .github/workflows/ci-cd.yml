name: API Nexus CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Test with Maven
        run: mvn -B package --file pom.xml

  build-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/web-console/package-lock.json
      - name: Install dependencies and build web-console
        run: |
          cd apps/web-console
          npm install
          npm run lint
      - name: Install dependencies and build developer-portal
        run: |
          cd apps/developer-portal
          npm install
          npm run lint

  build-docker-images:
    needs: [build-and-test-java, build-and-test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Edge Gateway Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/edge-gateway:latest ./services/edge-gateway
          docker push ghcr.io/${{ github.repository }}/edge-gateway:latest

      # In a real scenario, this would loop over all services and build them


